<html lang="en">
<head>
  <meta charset="UTF-8"/>

  <link rel="canonical" href="https://russian-tv.com/en/"/>
  <meta name="robots" content="noindex, follow"/>
  <title>Channel no longer available — Russian TV</title>
<script>
// Трекинг клика по любой ссылке на Telegram-канал — GA4 event + цель Яндекс.Метрики
(function(){
  function tgTrack(e){
    var a = e.target && e.target.closest ? e.target.closest('a[href*="t.me/RussiaTV_Hub_Live"]') : null;
    if(!a) return;
    var label = a.className || 'tg-link';
    try{ if(typeof gtag==='function') gtag('event','telegram_click',{event_category:'engagement',event_label:label,link_url:a.href}); }catch(err){}
    try{ if(typeof ym==='function') ym(110584472,'reachGoal','telegram_click',{label:label}); }catch(err){}
  }
  document.addEventListener('click', tgTrack, true);
})();
</script>
</head>
<body>
  <p>This channel is no longer broadcast on the site. <a href="https://russian-tv.com/en/">Go to the homepage — all current channels</a>.</p>
</body>
